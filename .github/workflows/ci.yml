name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Check imports
        run: scripts/check-imports.sh

      - name: Check skin archive dependency
        run: scripts/check-skin-dependency.sh

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: mac/.build
          key: spm-${{ runner.os }}-${{ hashFiles('mac/Package.swift', 'mac/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        working-directory: mac
        run: swift build

      - name: Build and test skin archive with Command Line Tools
        run: |
          clt=/Library/Developer/CommandLineTools
          if [[ ! -d "$clt" ]]; then
            echo "::error::Command Line Tools are required for the archive CI lane"
            exit 1
          fi
          frameworks="$clt/Library/Developer/Frameworks"
          export DEVELOPER_DIR="$clt"
          cd mac
          swift build --target WebbySkinArchive --scratch-path .build/clt
          swift test --scratch-path .build/clt --filter WebbySkinArchiveTests \
            -Xswiftc -F -Xswiftc "$frameworks" \
            -Xlinker -rpath -Xlinker "$frameworks" \
            -Xswiftc -Xfrontend -Xswiftc -disable-cross-import-overlays

      - name: Test
        run: scripts/test.sh --parallel

      - name: Build Webby.app
        run: scripts/build-app.sh

      - name: Check extension
        run: scripts/check-extension.sh

      - name: Shellcheck
        run: |
          brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
          shellcheck scripts/*.sh
